name: KidsCoding mandatory task accountability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history for task changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 61 product tasks, 432 lessons and one-task-per-PR rule
        env:
          TASK_VALIDATE_PR: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          TASK_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The PR event's base.sha can be stale after main advances.
          # Compare against the actual common ancestor of the checked-out
          # PR merge ref and current target branch; do not relax task rules.
          if [ "$TASK_VALIDATE_PR" = "1" ]; then
            TASK_BASE_SHA="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
            if [ -z "$TASK_BASE_SHA" ]; then
              echo "::error::Could not resolve current PR merge-base"
              exit 1
            fi
            export TASK_BASE_SHA
          fi
          python scripts/check-task-ledger.py
