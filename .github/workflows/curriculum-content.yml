      - name: Run Batch-3 Python specs with actual Pyodide in a sandboxed browser
        run: npx playwright test tests/e2e/python-lab-layout-ux411.spec.ts tests/e2e/python-error-recovery-ux412.spec.ts tests/e2e/python-cross-device-ux413.spec.ts --project=desktop

  portfolio-ux302:
