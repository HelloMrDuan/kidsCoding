permissions:
  contents: read

jobs:
  curriculum-web:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Curriculum contract tests
        run: npx vitest run src/content/curriculum/full-catalog-v1.test.ts src/features/curriculum/full-catalog-access.test.ts src/app/api/curriculum/catalog/route.test.ts src/features/python-lab/python-lab-grade.test.ts src/features/python-lab/python-multi-grade.test.ts src/features/curriculum/release-readiness.test.ts src/features/progress/local-practice.test.ts src/features/progress/cloud-python-drafts.test.ts src/app/api/practice/drafts/route.test.ts src/features/scratch-vm/scratch-local-draft.test.ts src/features/scratch-vm/scratch-cloud-draft.test.ts src/app/api/practice/scratch/route.test.ts src/features/lessons/playable-stage/use-block-executor.test.ts src/features/lessons/playable-stage/duo-executor.test.ts src/features/lessons/playable-stage/duo-dialogue-executor.test.ts src/features/lessons/playable-stage/duo-graduation-executor.test.ts src/features/lessons/complete-launch-lesson.test.ts src/features/progress/local-progress-storage.test.ts src/features/projects/build-project-completion-copy.test.ts src/features/projects/project-complete-card.test.tsx src/content/curriculum/foundation-units.test.ts src/features/curriculum/teaching-review.test.ts src/content/curriculum/duo-lesson-hints.test.ts src/features/lessons/grid/grid-engine.test.ts src/features/lessons/grid/grid-stage.test.tsx src/features/curriculum/engine-capabilities.test.ts src/content/curriculum/g0-u1-grid-lessons.test.ts src/features/lessons/grid/grid-draft.test.ts src/features/lessons/grid/grid-lab-pointer.test.ts src/features/lessons/voice/read-aloud.test.tsx src/features/curriculum/lesson-maturity.test.ts src/features/curriculum/lesson-schema.test.ts src/features/curriculum/child-trial.test.ts src/features/lessons/build-hint-state.test.ts src/features/lessons/remedial-routing.test.ts src/features/lessons/blockly/run-feedback.test.ts src/features/lessons/blockly/tq008-lesson-judging.test.ts src/features/lessons/blockly/observable-run.test.ts src/features/lessons/playable-stage/playable-stage-feedback.test.tsx src/content/curriculum/tq009-copy-alignment.test.ts src/content/curriculum/tq010-mistake-steps.test.ts src/features/lessons/playable-stage/playable-stage-mistake.test.tsx src/content/curriculum/tq011-practice-steps.test.ts src/features/lessons/playable-stage/playable-stage-practice.test.tsx src/content/curriculum/tq012-unit-projects.test.ts src/features/lessons/playable-stage/unit-project.test.tsx src/features/progress/project-snapshot.test.ts src/features/lessons/playable-stage/stage-walk.test.ts src/features/lessons/use-back-scroll-restore.test.ts src/app/api/guest/route.test.ts src/features/progress/guest-snapshot-payload.test.ts src/features/privacy/child-privacy-migration.test.ts src/features/progress/sync-guest-snapshot.test.ts src/features/lessons/guided-lesson-shell.test.tsx src/features/scratch-g2/scratch-g2-program.test.ts src/features/scratch-g2/scratch-g2-draft.test.ts src/content/curriculum/g2-u1-scratch-lessons.test.ts src/app/api/guardian-consent/route.test.ts src/features/privacy/guardian-consent-migration.test.ts src/features/parent/guardian-consent-button.test.tsx src/features/parent/lesson-knowledge.test.ts src/features/parent/build-parent-growth-report.test.ts src/features/parent/growth-knowledge-section.test.tsx src/app/parent/overview/page.test.tsx src/app/admin/catalog/page.test.tsx src/app/learn/catalog/status-sync-sys104.test.tsx src/features/ai-python/fruit-classifier.test.ts src/features/ai-python/u3-local-engines.test.ts
      - name: Production build
        run: npm run build
      - name: Frozen V2 tokens and recorded contrast limitations
        run: npx vitest run src/features/ui/tokens.test.ts
      - name: UX-002 component unit tests
        run: npx vitest run src/features/ui/button.test.tsx src/features/ui/status-tag.test.tsx src/features/ui/feedback-panel.test.tsx
      - name: UX-003 component unit tests
        run: npx vitest run src/features/ui/lesson-card.test.tsx src/features/ui/progress-track.test.tsx src/features/ui/story-dialog.test.tsx
      - name: UX-101 component unit tests
        run: npx vitest run src/features/lessons/adventure-map.test.tsx src/features/lessons/map-view.test.tsx
      - name: G2-U3-L02 unit tests (contract, judging, params boundaries, draft, sandbox/TS parity)
        run: npx vitest run src/features/lessons/g2-u3-l02
      - name: G2-U3-L03 unit tests (contract, judging, bounds boundaries, seeded sequence, draft, sandbox/TS parity)
        run: npx vitest run src/features/lessons/g2-u3-l03

  scratch-rls-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kidscoding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kidscoding_test"
          --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-account RLS against real PostgreSQL
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d kidscoding_test -v ON_ERROR_STOP=1 -f apps/web/scripts/scratch-cloud-rls.sql
      - name: TQ-013 child privacy RLS, guest_snapshots service-role only, retention purge
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U postgres -d kidscoding_test -c 'create database kidscoding_privacy'
          psql -h localhost -U postgres -d kidscoding_privacy -v ON_ERROR_STOP=1 -f apps/web/scripts/child-privacy-rls.sql

  offline-python-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 4 P0 examples and 16 offline unit tests
        run: python -m unittest discover -s examples/python/p0 -p 'test_course_projects.py' -v

  advanced-python-and-pygame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 8 unit-level Python reference projects
        run: python -m unittest discover -s examples/python/advanced -p 'test_*.py' -v
      - name: Install Pygame for actual game renderer
        run: python -m pip install -r examples/python/advanced/requirements-pygame.txt
      - name: Run Pygame game loop against SDL dummy display
        run: |
          cd examples/python/advanced
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python pygame_showcase.py --smoke

  scratch-sb3-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original Scratch 3 project, media and clone blocks
        run: python -m unittest discover -s examples/scratch/g3 -p 'test_*.py' -v
      - name: Package editable Scratch sb3 sample
        run: python examples/scratch/g3/build_scratch_project.py
      - name: Validate original G2-U1 Scratch lesson projects and embedded sandbox models
        run: python -m unittest discover -s examples/scratch/g2 -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: original-scratch-meteor-clones
          path: examples/scratch/g3/meteor_clones.sb3

