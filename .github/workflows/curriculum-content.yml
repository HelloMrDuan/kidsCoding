name: KidsCoding curriculum content checks

on:
  pull_request:
    paths:
      - 'apps/web/src/content/curriculum/**'
      - 'apps/web/src/features/curriculum/**'
      - 'apps/web/src/content/curriculum/track-g3-detailed-lessons-v2.json'
      - 'apps/web/src/content/curriculum/track-p1-detailed-lessons-v2.json'
      - 'apps/web/src/content/curriculum/track-p2-detailed-lessons-v2.json'
      - 'apps/web/src/app/learn/catalog/**'
      - 'apps/web/src/app/admin/catalog/**'
      - 'apps/web/src/app/api/curriculum/catalog/**'
      - 'apps/web/src/app/learn/map/page.tsx'
      - 'apps/web/src/app/admin/page.tsx'
      - 'examples/python/p0/**'
      - 'examples/python/advanced/**'
      - 'examples/scratch/g3/**'
      - 'apps/web/src/features/python-lab/**'
      - 'apps/web/src/features/progress/local-practice*'
      - 'apps/web/src/features/progress/cloud-python-drafts*'
      - 'apps/web/src/app/api/practice/drafts/**'
      - 'apps/web/supabase/migrations/202610100007_python_practice_drafts.sql'
      - 'apps/web/src/app/learn/portfolio/**'
      - 'apps/web/src/app/learn/python-lab/**'
      - 'apps/web/public/python-lab-sandbox.html'
      - 'apps/web/public/scratch-vm-sandbox.html'
      - 'apps/web/public/scratch-samples/**'
      - 'apps/web/src/app/api/practice/scratch/**'
      - 'apps/web/supabase/migrations/202610100010_scratch_private_drafts.sql'
      - 'apps/web/src/features/scratch-vm/**'
      - 'apps/web/src/features/lessons/playable-stage/**'
      - 'apps/web/src/app/learn/lesson/**'
      - 'apps/web/tests/e2e/guest-story.spec.ts'
      - 'apps/web/tests/e2e/blockly-first-run.spec.ts'
      - 'apps/web/tests/e2e/blockly-forest-sequence.spec.ts'
      - 'apps/web/src/app/learn/scratch-lab/**'
      - '.github/workflows/curriculum-content.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  curriculum-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Curriculum contract tests
        run: npx vitest run src/content/curriculum/full-catalog-v1.test.ts src/features/curriculum/full-catalog-access.test.ts src/app/api/curriculum/catalog/route.test.ts src/features/python-lab/python-lab-grade.test.ts src/features/python-lab/python-multi-grade.test.ts src/features/curriculum/release-readiness.test.ts src/features/progress/local-practice.test.ts src/features/progress/cloud-python-drafts.test.ts src/app/api/practice/drafts/route.test.ts src/features/scratch-vm/scratch-local-draft.test.ts src/features/scratch-vm/scratch-cloud-draft.test.ts src/app/api/practice/scratch/route.test.ts src/features/lessons/playable-stage/use-block-executor.test.ts
      - name: Production build
        run: npm run build

  scratch-rls-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kidscoding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kidscoding_test"
          --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-account RLS against real PostgreSQL
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d kidscoding_test -v ON_ERROR_STOP=1 -f apps/web/scripts/scratch-cloud-rls.sql

  offline-python-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 4 P0 examples and 16 offline unit tests
        run: python -m unittest discover -s examples/python/p0 -p 'test_course_projects.py' -v

  advanced-python-and-pygame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 8 unit-level Python reference projects
        run: python -m unittest discover -s examples/python/advanced -p 'test_*.py' -v
      - name: Install Pygame for actual game renderer
        run: python -m pip install -r examples/python/advanced/requirements-pygame.txt
      - name: Run Pygame game loop against SDL dummy display
        run: |
          cd examples/python/advanced
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python pygame_showcase.py --smoke

  scratch-sb3-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original Scratch 3 project, media and clone blocks
        run: python -m unittest discover -s examples/scratch/g3 -p 'test_*.py' -v
      - name: Package editable Scratch sb3 sample
        run: python examples/scratch/g3/build_scratch_project.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-scratch-meteor-clones
          path: examples/scratch/g3/meteor_clones.sb3

  python-browser-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Install real Chrome for browser E2E
        run: npx playwright install chrome --with-deps
      - name: Run first lesson with actual Pyodide Python in a sandboxed browser
        run: npx playwright test tests/e2e/python-lab.spec.ts tests/e2e/python-multi.spec.ts --project=desktop

  scratch-real-vm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Install actual Chrome
        run: npx playwright install chrome --with-deps
      - name: Run actual Scratch VM browser integration, no mocked VM
        run: npx playwright test tests/e2e/scratch-vm.spec.ts tests/e2e/blockly-first-run.spec.ts tests/e2e/blockly-forest-sequence.spec.ts --project=desktop
