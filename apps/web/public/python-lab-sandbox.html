<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; worker-src blob:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Isolated KidsCoding Python runtime</title>
</head>
<body>
<script id="worker-source" type="text/plain">
let pyodideInstance;
async function getPython() {
  if (pyodideInstance) return pyodideInstance;
  self.importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');
  pyodideInstance = await self.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});
  self.postMessage({kind:'LOADED'});
  return pyodideInstance;
}
self.onmessage = async (event) => {
  const source = event.data && event.data.source;
  if (typeof source !== 'string' || source.length > 5000) {
    self.postMessage({kind:'RESULT',output:'',error:'代码超出允许长度'});
    return;
  }
  try {
    const python = await getPython();
    let output = '';
    const addLine = (line) => {
      if (output.length < 4000) output += line + '\n';
    };
    python.setStdout({batched:addLine});
    python.setStderr({batched:addLine});
    // Each run executes in a fresh namespace inside the opaque-origin sandbox worker.
    // These tests are *local practice*, not a trustworthy exam or server grade.
    if (event.data.kind === 'RUN_TESTS') {
      const tests = event.data.tests;
      const argCount = {introduce:2, weather_line:2, number_or_text:2, greet_name:2, make_profile:3, ledger_row:3, contact_card:2};
      if (!Array.isArray(tests) || tests.length < 2 || tests.length > 6 ||
          tests.some(t => !t || !Object.prototype.hasOwnProperty.call(argCount, t.function) ||
                     !Array.isArray(t.args) || t.args.length !== argCount[t.function] ||
                     t.args.some((a, i) => typeof a !== 'string' || a.length > (t.function === 'contact_card' && i === 0 ? 200 : 40)))) {
        throw new Error('非法练习测试配置');
      }
      python.globals.set('__kc_source', source);
      python.globals.set('__kc_tests_json', JSON.stringify(tests));
      python.runPython([
        'import json',
        '__kc_ns = {"__builtins__": __builtins__}',
        'exec(compile(__kc_source, "<learner>", "exec"), __kc_ns)',
        '__kc_results = []',
        'for __kc_case in json.loads(__kc_tests_json):',
        '    try:',
        '        __kc_value = __kc_ns[__kc_case["function"]](*__kc_case["args"])',
        '        __kc_results.append(str(__kc_value))',
        '    except Exception as __kc_error:',
        '        __kc_results.append("ERROR:" + type(__kc_error).__name__)'
      ].join('\n'));
      const proxy = python.globals.get('__kc_results');
      const cases = proxy.toJs();
      proxy.destroy();
      self.postMessage({kind:'RESULT',output:output.slice(0,4000),cases,error:null});
    } else if (event.data.kind === 'RUN_CUSTOM') {
      // TQ-005 练习 B：用孩子自选的参数真实调用一次函数，只返回结果，不评分。
      const argCount = {introduce:2, weather_line:2, number_or_text:2, greet_name:2, make_profile:3, ledger_row:3, contact_card:2};
      const fn = event.data.function;
      const args = event.data.args;
      if (!fn || !Object.prototype.hasOwnProperty.call(argCount, fn) ||
          !Array.isArray(args) || args.length !== argCount[fn] ||
          args.some((a, i) => typeof a !== 'string' || a.length > (fn === 'contact_card' && i === 0 ? 200 : 40))) {
        throw new Error('非法自选输入');
      }
      python.globals.set('__kc_source', source);
      python.globals.set('__kc_fn', fn);
      python.globals.set('__kc_args_json', JSON.stringify(args));
      python.runPython([
        'import json',
        '__kc_ns = {"__builtins__": __builtins__}',
        'exec(compile(__kc_source, "<learner>", "exec"), __kc_ns)',
        'try:',
        '    __kc_custom = str(__kc_ns[__kc_fn](*json.loads(__kc_args_json)))',
        'except Exception as __kc_error:',
        '    __kc_custom = "ERROR:" + type(__kc_error).__name__'
      ].join('\n'));
      // __kc_custom is always a Python str, which globals.get() returns as a
      // plain JS string (not a PyProxy), so there is no .toJs() to call.
      const customRaw = python.globals.get('__kc_custom');
      const custom = typeof customRaw === 'string' ? customRaw : String(customRaw);
      if (customRaw && typeof customRaw.destroy === 'function') customRaw.destroy();
      self.postMessage({kind:'RESULT',output:output.slice(0,4000),custom,error:null});
    } else {
      python.runPython('exec(compile(' + JSON.stringify(source) + ', "<learner>", "exec"), {"__builtins__": __builtins__})');
      self.postMessage({kind:'RESULT',output:output.slice(0,4000),error:null});
    }
  } catch (error) {
    self.postMessage({kind:'RESULT',output:'',error:String(error).slice(0,800)});
  }
};
</script>
<script>
(() => {
  let activeWorker = null;
  let activeId = null;
  function stop() {
    if (activeWorker) activeWorker.terminate();
    activeWorker = null;
    activeId = null;
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || !event.data) return;
    const data = event.data;
    if (data.kind === 'PING') {
      window.parent.postMessage({kind:'FRAME_READY'}, '*');
      return;
    }
    if (data.kind === 'STOP' && data.id === activeId) {
      stop();
      return;
    }
    if (!['RUN','RUN_TESTS','RUN_CUSTOM'].includes(data.kind) || !Number.isSafeInteger(data.id)) return;
    stop();
    const blob = new Blob([document.getElementById('worker-source').textContent], {type:'text/javascript'});
    const address = URL.createObjectURL(blob);
    const worker = new Worker(address);
    URL.revokeObjectURL(address);
    activeId = data.id;
    activeWorker = worker;
    worker.onmessage = (message) => {
      if (worker !== activeWorker) return;
      window.parent.postMessage({kind:message.data.kind, id:activeId, output:message.data.output, error:message.data.error, cases:message.data.cases, custom:message.data.custom}, '*');
      if (message.data.kind === 'RESULT') stop();
    };
    worker.onerror = () => {
      window.parent.postMessage({kind:'RESULT',id:activeId,output:'',error:'Python 引擎加载或执行失败'},'*');
      stop();
    };
    worker.postMessage({kind:data.kind,source:data.source,tests:data.tests,function:data.function,args:data.args});
  });
})();
</script>
</body>
</html>
