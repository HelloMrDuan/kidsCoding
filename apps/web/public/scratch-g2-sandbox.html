<!-- Lesson models are generated by examples/scratch/g2/build_g2_projects.py (--write). Do not edit by hand. -->
<script type="application/json" id="kc-g2-models">{"G2-U1-L01": {"params": [{"block": "cat_goto", "kind": "int", "max": 240, "min": -240, "slot": "X", "target": "小橘猫"}, {"block": "cat_goto", "kind": "int", "max": 180, "min": -180, "slot": "Y", "target": "小橘猫"}, {"block": "cat_say", "kind": "text", "maxLength": 20, "slot": "MESSAGE", "target": "小橘猫"}, {"block": "bird_goto", "kind": "int", "max": 240, "min": -240, "slot": "X", "target": "小鸟"}, {"block": "bird_goto", "kind": "int", "max": 180, "min": -180, "slot": "Y", "target": "小鸟"}, {"block": "bird_say", "kind": "text", "maxLength": 20, "slot": "MESSAGE", "target": "小鸟"}], "sprites": [{"blocks": {"cat_click": {"fields": {}, "inputs": {}, "next": "cat_say", "opcode": "event_whenthisspriteclicked", "parent": null, "shadow": false, "topLevel": true}, "cat_flag": {"fields": {}, "inputs": {}, "next": "cat_goto", "opcode": "event_whenflagclicked", "parent": null, "shadow": false, "topLevel": true}, "cat_goto": {"fields": {}, "inputs": {"X": [1, [4, "-120"]], "Y": [1, [4, "-80"]]}, "next": null, "opcode": "motion_gotoxy", "parent": "cat_flag", "shadow": false, "topLevel": false}, "cat_say": {"fields": {}, "inputs": {"MESSAGE": [1, [10, "你好！我是小橘猫。"]], "SECS": [1, [4, "2"]]}, "next": null, "opcode": "looks_sayforsecs", "parent": "cat_click", "shadow": false, "topLevel": false}}, "costumes": ["小橘猫"], "name": "小橘猫", "sounds": []}, {"blocks": {"bird_click": {"fields": {}, "inputs": {}, "next": "bird_say", "opcode": "event_whenthisspriteclicked", "parent": null, "shadow": false, "topLevel": true}, "bird_flag": {"fields": {}, "inputs": {}, "next": "bird_goto", "opcode": "event_whenflagclicked", "parent": null, "shadow": false, "topLevel": true}, "bird_goto": {"fields": {}, "inputs": {"X": [1, [4, "-150"]], "Y": [1, [4, "110"]]}, "next": null, "opcode": "motion_gotoxy", "parent": "bird_flag", "shadow": false, "topLevel": false}, "bird_say": {"fields": {}, "inputs": {"MESSAGE": [1, [10, "叽叽！我想回到鸟窝。"]], "SECS": [1, [4, "2"]]}, "next": null, "opcode": "looks_sayforsecs", "parent": "bird_click", "shadow": false, "topLevel": false}}, "costumes": ["小鸟"], "name": "小鸟", "sounds": []}], "stage": {"blocks": {}, "costumes": ["春日公园"], "sounds": []}}, "G2-U1-L02": {"params": [{"block": "cat_costume_menu", "kind": "choice", "options": ["站立", "挥手"], "slot": "COSTUME", "target": "小橘猫"}, {"block": "cat_repeat", "kind": "int", "max": 10, "min": 1, "slot": "TIMES", "target": "小橘猫"}, {"block": "cat_wait", "kind": "tenths", "max": 1.0, "min": 0.2, "slot": "DURATION", "target": "小橘猫"}, {"block": "bird_costume_menu", "kind": "choice", "options": ["收翅", "展翅"], "slot": "COSTUME", "target": "小鸟"}], "sprites": [{"blocks": {"cat_click": {"fields": {}, "inputs": {}, "next": "cat_repeat", "opcode": "event_whenthisspriteclicked", "parent": null, "shadow": false, "topLevel": true}, "cat_costume_menu": {"fields": {"COSTUME": ["站立", null]}, "inputs": {}, "next": null, "opcode": "looks_costume", "parent": "cat_switch", "shadow": true, "topLevel": false}, "cat_flag": {"fields": {}, "inputs": {}, "next": "cat_switch", "opcode": "event_whenflagclicked", "parent": null, "shadow": false, "topLevel": true}, "cat_next": {"fields": {}, "inputs": {}, "next": "cat_wait", "opcode": "looks_nextcostume", "parent": "cat_repeat", "shadow": false, "topLevel": false}, "cat_repeat": {"fields": {}, "inputs": {"SUBSTACK": [2, "cat_next"], "TIMES": [1, [4, "1"]]}, "next": null, "opcode": "control_repeat", "parent": "cat_click", "shadow": false, "topLevel": false}, "cat_switch": {"fields": {}, "inputs": {"COSTUME": [1, "cat_costume_menu"]}, "next": null, "opcode": "looks_switchcostumeto", "parent": "cat_flag", "shadow": false, "topLevel": false}, "cat_wait": {"fields": {}, "inputs": {"DURATION": [1, [4, "0.5"]]}, "next": null, "opcode": "control_wait", "parent": "cat_next", "shadow": false, "topLevel": false}}, "costumes": ["站立", "挥手"], "name": "小橘猫", "sounds": []}, {"blocks": {"bird_click": {"fields": {}, "inputs": {}, "next": "bird_next", "opcode": "event_whenthisspriteclicked", "parent": null, "shadow": false, "topLevel": true}, "bird_costume_menu": {"fields": {"COSTUME": ["收翅", null]}, "inputs": {}, "next": null, "opcode": "looks_costume", "parent": "bird_switch", "shadow": true, "topLevel": false}, "bird_flag": {"fields": {}, "inputs": {}, "next": "bird_switch", "opcode": "event_whenflagclicked", "parent": null, "shadow": false, "topLevel": true}, "bird_next": {"fields": {}, "inputs": {}, "next": null, "opcode": "looks_nextcostume", "parent": "bird_click", "shadow": false, "topLevel": false}, "bird_switch": {"fields": {}, "inputs": {"COSTUME": [1, "bird_costume_menu"]}, "next": null, "opcode": "looks_switchcostumeto", "parent": "bird_flag", "shadow": false, "topLevel": false}}, "costumes": ["收翅", "展翅"], "name": "小鸟", "sounds": []}], "stage": {"blocks": {}, "costumes": ["演出舞台"], "sounds": []}}}</script>
<script>
(() => {
  // G2 lesson sandbox. Like the G3 meteor sandbox it never runs an arbitrary
  // Scratch project: a project is accepted only when it is structurally the
  // lesson model (same targets, costume/sound names, block ids, opcodes,
  // wiring and constants); only the parameters the model lists may differ,
  // and each is range/length checked. Anything else fails closed and the last
  // working project is kept.
  const MODELS = JSON.parse(document.getElementById('kc-g2-models').textContent || '{}');
  const MAX_ZIP_ENTRIES = 40;
  const MAX_UNCOMPRESSED_BYTES = 10_000_000;
  const MAX_ASSET_BYTES = 400_000;
  const PRIMITIVE_OPCODES = {4: 'math_number', 5: 'math_positive_number', 6: 'math_whole_number', 7: 'math_integer', 8: 'math_angle', 10: 'text'};
  let vm = null;
  let timer = null;
  let currentId = null;
  let lessonId = null;
  let ready = false;
  let currentParams = {};
  let bubbles = {};
  let soundLog = [];

  function send(kind, info = {}) {
    window.parent.postMessage({kind, id: currentId, ...info}, '*');
  }
  function reset() {
    if (timer) clearInterval(timer);
    timer = null;
    if (vm) {
      try { vm.stopAll(); } catch (_error) {}
      try { vm.quit(); } catch (_error) {}
    }
    vm = null;
    bubbles = {};
    soundLog = [];
  }
  function storageAvailable() {
    return typeof window.VirtualMachine === 'function' && !!window.ScratchStorage;
  }
  function newMachine() {
    const Storage = typeof window.ScratchStorage === 'function' ? window.ScratchStorage : window.ScratchStorage.ScratchStorage;
    const machine = new window.VirtualMachine();
    machine.attachStorage(new Storage());
    return machine;
  }
  function nameOf(target) {
    return typeof target.getName === 'function' ? target.getName() : target.sprite?.name;
  }
  function paramKey(target, blockId, slot) { return target + '|' + blockId + '|' + slot; }

  function validateZipArchive(buffer) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);
    const tailStart = Math.max(0, bytes.length - 65557);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= tailStart; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ZIP 结构非法');
    const totalEntries = view.getUint16(eocd + 10, true);
    const cdSize = view.getUint32(eocd + 12, true);
    const cdOffset = view.getUint32(eocd + 16, true);
    if (totalEntries === 0xffff || cdOffset === 0xffffffff) throw new Error('不支持 ZIP64 工程');
    if (totalEntries < 1 || totalEntries > MAX_ZIP_ENTRIES) throw new Error('ZIP 条目数量不符合要求');
    if (cdOffset + cdSize > bytes.length) throw new Error('ZIP 目录越界');
    const namePattern = /^(project\.json|[0-9a-f]{32}\.(svg|png|wav|mp3))$/;
    let offset = cdOffset;
    let total = 0;
    let sawProject = false;
    for (let n = 0; n < totalEntries; n++) {
      if (view.getUint32(offset, true) !== 0x02014b50) throw new Error('ZIP 目录损坏');
      const uncompressed = view.getUint32(offset + 24, true);
      const nameLen = view.getUint16(offset + 28, true);
      const extraLen = view.getUint16(offset + 30, true);
      const commentLen = view.getUint16(offset + 32, true);
      const name = new TextDecoder().decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
      if (!namePattern.test(name)) throw new Error('ZIP 条目路径非法：' + name.slice(0, 80));
      if (name === 'project.json') sawProject = true;
      total += uncompressed;
      if (total > MAX_UNCOMPRESSED_BYTES) throw new Error('ZIP 解包后体积超限');
      offset += 46 + nameLen + extraLen + commentLen;
    }
    if (!sawProject) throw new Error('ZIP 缺少 project.json');
  }

  function checkParamValue(param, raw) {
    if (param.kind === 'int') {
      const value = Number(raw);
      if (!Number.isInteger(value) || value < param.min || value > param.max) {
        throw new Error('数字超出允许范围（' + param.min + '～' + param.max + '）：' + String(raw).slice(0, 20));
      }
      return value;
    }
    if (param.kind === 'tenths') {
      const value = Number(raw);
      if (!Number.isFinite(value) || value < param.min - 1e-9 || value > param.max + 1e-9 || Math.abs(value * 10 - Math.round(value * 10)) > 1e-9) {
        throw new Error('秒数必须在 ' + param.min + '～' + param.max + ' 之间、以 0.1 秒为一格：' + String(raw).slice(0, 20));
      }
      return Math.round(value * 10) / 10;
    }
    if (param.kind === 'text') {
      const value = String(raw);
      if (value.length < 1 || value.length > param.maxLength || /[\u0000-\u001f\u007f<>]/.test(value)) {
        throw new Error('文字必须是 1～' + param.maxLength + ' 个字，且不能含换行或尖括号');
      }
      return value;
    }
    if (param.kind === 'choice') {
      const value = String(raw);
      if (!param.options.includes(value)) throw new Error('选项不在课程允许范围：' + value.slice(0, 30));
      return value;
    }
    throw new Error('未知参数类型');
  }
  function paramsFor(model, target) {
    const map = {};
    for (const param of model.params) if (param.target === target) map[param.block + '|' + param.slot] = param;
    return map;
  }
  function sameNames(actual, expected) {
    return actual.length === expected.length && actual.every((name, i) => name === expected[i]);
  }

  // Compares one VM target (internal block representation after loadProject:
  // inputs are {block, shadow}, fields are {name, value}) with the model.
  function readTarget(target, spec, model, label) {
    const costumes = typeof target.getCostumes === 'function' ? target.getCostumes() : (target.sprite?.costumes ?? []);
    const sounds = target.sprite?.sounds ?? [];
    if (!sameNames(costumes.map(c => c.name), spec.costumes)) throw new Error(label + '的造型不符合课程模型');
    for (const costume of costumes) {
      if (costume.dataFormat !== 'svg' || !/^[0-9a-f]{32}$/.test(costume.assetId ?? '')) throw new Error(label + '的造型格式不符合要求');
      if (!costume.asset || costume.asset.data.byteLength > MAX_ASSET_BYTES) throw new Error(label + '的造型文件过大或缺失');
    }
    if (!sameNames(sounds.map(s => s.name), spec.sounds)) throw new Error(label + '的声音不符合课程模型');
    for (const sound of sounds) {
      if (!['wav', 'mp3'].includes(sound.dataFormat) || !/^[0-9a-f]{32}$/.test(sound.assetId ?? '')) throw new Error(label + '的声音格式不符合要求');
    }
    if (Object.keys(target.variables ?? {}).length !== 0) throw new Error(label + '含有课程模型之外的变量');
    const byId = target.blocks._blocks;
    if (!byId) throw new Error('无法读取积木集合');
    const allowedParams = paramsFor(model, spec.name ?? 'Stage');
    const allowed = new Set(Object.keys(spec.blocks));
    const values = {};
    for (const [id, canon] of Object.entries(spec.blocks)) {
      const actual = byId[id];
      if (!actual) throw new Error(label + '缺少课程积木：' + id);
      if (actual.opcode !== canon.opcode) throw new Error('不允许的积木类型：' + actual.opcode);
      if ((actual.next ?? null) !== canon.next || (actual.parent ?? null) !== canon.parent ||
          Boolean(actual.topLevel) !== Boolean(canon.topLevel) || Boolean(actual.shadow) !== Boolean(canon.shadow)) {
        throw new Error('积木连接不符合课程模型：' + id);
      }
      const inputNames = Object.keys(actual.inputs ?? {}).sort();
      if (!sameNames(inputNames, Object.keys(canon.inputs).sort())) throw new Error('积木输入不符合课程模型：' + id);
      for (const [inputName, canonInput] of Object.entries(canon.inputs)) {
        const ref = actual.inputs[inputName]?.block;
        if (Array.isArray(canonInput[1])) {
          const primitive = byId[ref];
          const opcode = PRIMITIVE_OPCODES[canonInput[1][0]];
          if (!primitive || primitive.opcode !== opcode || (primitive.parent ?? null) !== id) throw new Error('积木数值丢失：' + id);
          allowed.add(ref);
          const fieldName = opcode === 'text' ? 'TEXT' : 'NUM';
          const raw = primitive.fields?.[fieldName]?.value;
          const param = allowedParams[id + '|' + inputName];
          if (param) values[paramKey(spec.name ?? 'Stage', id, inputName)] = checkParamValue(param, raw);
          else if (String(raw) !== String(canonInput[1][1])) throw new Error('积木数值被改动：' + id);
        } else if (ref !== canonInput[1]) {
          throw new Error('积木嵌套不符合课程模型：' + id);
        }
      }
      const fieldNames = Object.keys(actual.fields ?? {}).sort();
      if (!sameNames(fieldNames, Object.keys(canon.fields).sort())) throw new Error('积木选项不符合课程模型：' + id);
      for (const [fieldName, canonField] of Object.entries(canon.fields)) {
        const raw = actual.fields[fieldName]?.value;
        const param = allowedParams[id + '|' + fieldName];
        if (param) values[paramKey(spec.name ?? 'Stage', id, fieldName)] = checkParamValue(param, raw);
        else if (String(raw) !== String(canonField[0])) throw new Error('积木选项被改动：' + id);
      }
    }
    for (const id of Object.keys(byId)) {
      if (!allowed.has(id)) throw new Error(label + '出现了课程模型之外的积木');
    }
    return values;
  }

  function readProject(candidate, model) {
    const originals = candidate.runtime.targets.filter(t => t.isOriginal);
    const stages = originals.filter(t => t.isStage);
    const sprites = originals.filter(t => !t.isStage);
    if (stages.length !== 1) throw new Error('舞台数量不符合课程模型');
    if (sprites.length !== model.sprites.length) throw new Error('精灵数量不符合课程模型（应为 ' + model.sprites.length + ' 个）');
    let params = readTarget(stages[0], {...model.stage, name: 'Stage'}, model, '舞台');
    const seen = new Set();
    for (const target of sprites) {
      const name = nameOf(target);
      const spec = model.sprites.find(s => s.name === name);
      if (!spec) throw new Error('精灵不在课程名单：' + String(name).slice(0, 30));
      if (seen.has(name)) throw new Error('精灵重复：' + name);
      seen.add(name);
      params = {...params, ...readTarget(target, spec, model, name)};
    }
    return params;
  }

  function svgSize(text) {
    const width = Number(/<svg[^>]*\swidth="([\d.]+)/.exec(text)?.[1]);
    const height = Number(/<svg[^>]*\sheight="([\d.]+)/.exec(text)?.[1]);
    if (Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0) return {w: width, h: height};
    const box = /viewBox="[\d.\-]+\s+[\d.\-]+\s+([\d.]+)\s+([\d.]+)"/.exec(text);
    return box ? {w: Number(box[1]), h: Number(box[2])} : {w: 64, h: 64};
  }
  function describeAssets() {
    return vm.runtime.targets.filter(t => t.isOriginal).map(target => ({
      name: target.isStage ? 'Stage' : nameOf(target),
      isStage: Boolean(target.isStage),
      costumes: target.getCostumes().map(costume => {
        const textData = new TextDecoder().decode(costume.asset.data);
        const size = svgSize(textData);
        return {name: costume.name, uri: costume.asset.encodeDataURI(), w: size.w, h: size.h,
          cx: Number(costume.rotationCenterX) || 0, cy: Number(costume.rotationCenterY) || 0};
      }),
      sounds: (target.sprite?.sounds ?? []).map(sound => sound.name),
    }));
  }
  function snapshot() {
    if (!vm || !vm.runtime) return;
    const stage = vm.runtime.getTargetForStage();
    const targets = vm.runtime.targets.filter(t => !t.isStage).map(t => ({
      id: String(t.id), name: nameOf(t), x: Number(t.x), y: Number(t.y), visible: Boolean(t.visible),
      size: Number(t.size), original: Boolean(t.isOriginal),
      costume: t.getCostumes()[t.currentCostume]?.name ?? '', costumeIndex: Number(t.currentCostume),
    }));
    // Speech bubbles are read from each sprite's real VM looks state (the
    // "say for secs" timeout clears it there without emitting an event).
    const bubbleState = {};
    for (const t of vm.runtime.targets) {
      if (t.isStage || !t.isOriginal) continue;
      const looks = typeof t.getCustomState === 'function' ? t.getCustomState('Scratch.looks') : null;
      if (looks && looks.text) bubbleState[nameOf(t)] = {type: looks.type, text: String(looks.text).slice(0, 60)};
    }
    bubbles = bubbleState;
    send('SNAPSHOT', {targets, backdrop: stage?.getCostumes()[stage.currentCostume]?.name ?? '',
      stage: {x: Number(stage?.x ?? 0), y: Number(stage?.y ?? 0)},
      bubbles, activeThreads: vm.runtime.threads?.length ?? 0, sounds: soundLog.slice(-20)});
  }
  function findTarget(name) {
    if (name === 'Stage') return vm.runtime.getTargetForStage();
    return vm.runtime.targets.find(t => !t.isStage && t.isOriginal && nameOf(t) === name) ?? null;
  }
  function setParam(model, target, key, raw) {
    const [targetName, blockId, slot] = key.split('|');
    if (targetName !== target) throw new Error('参数与所选对象不一致');
    const param = model.params.find(p => p.target === targetName && p.block === blockId && p.slot === slot);
    if (!param) throw new Error('这个积木参数在本课不能修改：' + blockId);
    const value = checkParamValue(param, raw);
    const vmTarget = findTarget(targetName);
    if (!vmTarget) throw new Error('找不到对象：' + targetName);
    const owner = vmTarget.blocks.getBlock(blockId);
    if (!owner) throw new Error('VM 中找不到积木：' + blockId);
    if (owner.inputs?.[slot]) {
      const primitive = vmTarget.blocks.getBlock(owner.inputs[slot].block);
      const fieldName = primitive?.opcode === 'text' ? 'TEXT' : 'NUM';
      if (!primitive || !primitive.fields?.[fieldName]) throw new Error('VM 中缺少输入积木：' + blockId);
      vmTarget.blocks.changeBlock({id: primitive.id, element: 'field', name: fieldName, value: String(value)});
      if (String(vmTarget.blocks.getBlock(primitive.id).fields[fieldName].value) !== String(value)) throw new Error('Scratch VM 未接受修改');
    } else if (owner.fields?.[slot]) {
      vmTarget.blocks.changeBlock({id: blockId, element: 'field', name: slot, value: String(value)});
      if (String(vmTarget.blocks.getBlock(blockId).fields[slot].value) !== String(value)) throw new Error('Scratch VM 未接受修改');
    } else {
      throw new Error('积木没有这个参数：' + slot);
    }
    return value;
  }
  function attachObservers(machine) {
    machine.runtime.on('SAY', (target, type, text) => {
      const name = nameOf(target);
      if (text) send('SAID', {target: name, text: String(text).slice(0, 60)});
    });
  }

  window.addEventListener('message', async (event) => {
    if (event.source !== window.parent || !event.data) return;
    const data = event.data;
    if (data.kind === 'PING') {
      send('FRAME_READY', {available: storageAvailable()});
      return;
    }
    if (data.kind === 'STOP' && data.id === currentId) {
      try { vm?.stopAll(); } catch (_error) {}
      bubbles = {};
      snapshot();
      send('STOPPED');
      return;
    }
    const model = lessonId ? MODELS[lessonId] : null;
    if (data.kind === 'RUN' && data.id === currentId && vm && ready) {
      try { vm.greenFlag(); snapshot(); send('STARTED'); } catch (error) { send('ERROR', {error: String(error).slice(0, 400)}); }
      return;
    }
    if (data.kind === 'CLICK' && data.id === currentId && vm && ready) {
      const target = findTarget(String(data.target));
      if (!target) { send('ERROR', {error: '找不到对象：' + String(data.target).slice(0, 30)}); return; }
      // Real VM hat dispatch: the same hats Scratch starts when a sprite or the backdrop is clicked.
      if (target.isStage) vm.runtime.startHats('event_whenstageclicked', null, target);
      else vm.runtime.startHats('event_whenthisspriteclicked', null, target);
      snapshot();
      send('CLICKED', {target: target.isStage ? 'Stage' : nameOf(target), isStage: Boolean(target.isStage)});
      return;
    }
    if (data.kind === 'TRY_MOVE' && data.id === currentId && vm && ready) {
      const target = findTarget(String(data.target));
      const x = Number(data.x), y = Number(data.y);
      if (!target || !Number.isFinite(x) || !Number.isFinite(y)) { send('ERROR', {error: '移动请求无效'}); return; }
      if (!target.isStage) { send('ERROR', {error: '精灵要用积木程序移动，请应用“移到 x y”积木后点绿旗。'}); return; }
      // Ask the real VM stage to move. Scratch's RenderedTarget.setXY ignores the
      // stage, so the reported before/after coordinates prove it did not move.
      const before = {x: Number(target.x), y: Number(target.y)};
      target.setXY(x, y);
      const after = {x: Number(target.x), y: Number(target.y)};
      send('MOVE_RESULT', {target: 'Stage', isStage: true, requested: {x, y}, before, after,
        moved: before.x !== after.x || before.y !== after.y});
      snapshot();
      return;
    }
    if (data.kind === 'TRY_COSTUME' && data.id === currentId && vm && ready) {
      const target = findTarget(String(data.target));
      const costume = String(data.costume ?? '').slice(0, 40);
      if (!target || !costume) { send('ERROR', {error: '换造型请求无效'}); return; }
      if (!target.isStage) { send('ERROR', {error: '精灵要用积木程序换造型，请应用积木后运行。'}); return; }
      // Run Scratch's own "switch costume to" block code against the stage. The
      // stage only owns backdrops, so a sprite costume name changes nothing.
      const costumesOf = () => vm.runtime.targets.filter(t => t.isOriginal).map(t => ({
        name: t.isStage ? 'Stage' : nameOf(t), costume: t.getCostumes()[t.currentCostume]?.name ?? ''}));
      const before = costumesOf();
      try { vm.runtime._primitives.looks_switchcostumeto({COSTUME: costume}, {target}); } catch (_error) {}
      const after = costumesOf();
      const changed = before.some((b, i) => b.costume !== after[i]?.costume);
      send('COSTUME_RESULT', {target: 'Stage', requested: costume, before, after, changed,
        stageCostumes: target.getCostumes().map(c => c.name)});
      snapshot();
      return;
    }
    if (data.kind === 'CONFIGURE' && data.id === currentId && vm && ready && model) {
      const target = String(data.target ?? '');
      const values = data.values && typeof data.values === 'object' ? data.values : null;
      if (!values || !Object.keys(values).length) { send('ERROR', {error: '没有要应用的积木参数'}); return; }
      try {
        vm.stopAll();
        // Validate every value before touching the VM so a bad value changes nothing.
        for (const [key, raw] of Object.entries(values)) {
          const [targetName, blockId, slot] = key.split('|');
          const param = model.params.find(p => p.target === targetName && p.block === blockId && p.slot === slot);
          if (targetName !== target || !param) throw new Error('这个积木参数在本课不能修改');
          checkParamValue(param, raw);
        }
        const applied = {};
        for (const [key, raw] of Object.entries(values)) applied[key] = setParam(model, target, key, raw);
        currentParams = {...currentParams, ...applied};
        send('CONFIGURED', {target, params: currentParams});
        snapshot();
      } catch (error) {
        send('ERROR', {error: '修改 Scratch VM 积木失败：' + String(error).slice(0, 300), phase: 'configure'});
      }
      return;
    }
    if (data.kind === 'SAVE_DRAFT' && data.id === currentId && vm && ready) {
      try {
        const blob = await vm.saveProjectSb3();
        if (!(blob instanceof Blob) || blob.size < 300 || blob.size > 5_000_000) throw new Error('Scratch 文件大小异常');
        const archive = await blob.arrayBuffer();
        window.parent.postMessage({kind: 'DRAFT_EXPORTED', id: currentId, archive}, '*', [archive]);
      } catch (error) {
        send('DRAFT_SAVE_FAILED', {error: '本机草稿打包失败：' + String(error).slice(0, 300)});
      }
      return;
    }
    if (data.kind === 'EXPORT' && data.id === currentId && vm && ready && model) {
      let checker = null;
      try {
        vm.stopAll();
        const blob = await vm.saveProjectSb3();
        if (!(blob instanceof Blob) || blob.size < 300 || blob.size > 5_000_000) throw new Error('导出文件大小不符合要求');
        const archive = await blob.arrayBuffer();
        // Re-open the exported bytes in a second, independent VM and re-check the model.
        checker = newMachine();
        await checker.loadProject(archive.slice(0));
        const reloaded = readProject(checker, model);
        for (const [key, value] of Object.entries(currentParams)) {
          if (String(reloaded[key]) !== String(value)) throw new Error('重新载入后的积木参数不一致：' + key);
        }
        window.parent.postMessage({kind: 'PROJECT_EXPORTED', id: currentId, archive, params: reloaded}, '*', [archive]);
      } catch (error) {
        send('ERROR', {error: 'Scratch VM 项目导出或回读失败：' + String(error).slice(0, 400), phase: 'export'});
      } finally {
        if (checker) { try { checker.quit(); } catch (_error) {} }
      }
      return;
    }
    if (data.kind !== 'LOAD' || !Number.isSafeInteger(data.id) || !(data.archive instanceof ArrayBuffer)) return;
    const nextLesson = String(data.lessonId ?? '');
    const nextModel = MODELS[nextLesson];
    currentId = data.id;
    if (!nextModel) { send('ERROR', {error: '沙箱没有这节课的模型：' + nextLesson.slice(0, 20), phase: 'load'}); return; }
    if (!storageAvailable()) { send('ERROR', {error: 'Scratch VM 未加载，请检查 CDN 网络。', phase: 'load'}); return; }
    let candidate = null;
    try {
      if (data.archive.byteLength < 300 || data.archive.byteLength > 5_000_000) throw new Error('项目大小不符合要求');
      const signature = new Uint8Array(data.archive, 0, 2);
      if (signature[0] !== 0x50 || signature[1] !== 0x4b) throw new Error('项目不是 Scratch ZIP');
      validateZipArchive(data.archive);
      candidate = newMachine();
      await candidate.loadProject(data.archive);
      const params = readProject(candidate, nextModel);
      attachObservers(candidate);
      candidate.start();
      reset();
      vm = candidate;
      candidate = null;
      ready = true;
      lessonId = nextLesson;
      currentParams = params;
      send('PROJECT_LOADED', {params, assets: describeAssets(), imported: Boolean(data.imported), source: data.source ?? 'sample'});
      snapshot();
      timer = setInterval(snapshot, 100);
    } catch (error) {
      send('ERROR', {error: '导入 Scratch 项目失败，原作品不变：' + String(error).slice(0, 400), phase: 'load'});
    } finally {
      if (candidate) { try { candidate.quit(); } catch (_error) {} }
    }
  });
})();
</script>
