<script>
(() => {
  // G2 lesson sandbox. Like the G3 meteor sandbox it never runs an arbitrary
  // Scratch project: a project is accepted only when it is structurally the
  // lesson model (same targets, costume/sound names, block ids, opcodes,
  // wiring and constants); only the parameters the model lists may differ,
  // and each is range/length checked. Anything else fails closed and the last
  // working project is kept.
  const MODELS = JSON.parse(document.getElementById('kc-g2-models').textContent || '{}');
  const MAX_ZIP_ENTRIES = 40;
  const MAX_UNCOMPRESSED_BYTES = 10_000_000;
  const MAX_ASSET_BYTES = 400_000;
  const PRIMITIVE_OPCODES = {4: 'math_number', 5: 'math_positive_number', 6: 'math_whole_number', 7: 'math_integer', 8: 'math_angle', 10: 'text', 11: 'event_broadcast_menu'};
  const PRIMITIVE_FIELD = {text: 'TEXT', event_broadcast_menu: 'BROADCAST_OPTION'};
  let vm = null;
  let timer = null;
  let currentId = null;
  let lessonId = null;
  let ready = false;
  let currentParams = {};
  let bubbles = {};
  let soundLog = [];

  function send(kind, info = {}) {
    window.parent.postMessage({kind, id: currentId, ...info}, '*');
  }
  function reset() {
    if (timer) clearInterval(timer);
    timer = null;
    if (vm) {
      try { vm.stopAll(); } catch (_error) {}
      try { vm.quit(); } catch (_error) {}
    }
    vm = null;
    bubbles = {};
    soundLog = [];
  }
  function storageAvailable() {
    return typeof window.VirtualMachine === 'function' && !!window.ScratchStorage;
  }
  function newMachine() {
    const Storage = typeof window.ScratchStorage === 'function' ? window.ScratchStorage : window.ScratchStorage.ScratchStorage;
    const machine = new window.VirtualMachine();
    machine.attachStorage(new Storage());
    return machine;
  }
  function nameOf(target) {
    return typeof target.getName === 'function' ? target.getName() : target.sprite?.name;
  }
  function paramKey(target, blockId, slot) { return target + '|' + blockId + '|' + slot; }

  function validateZipArchive(buffer) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);
    const tailStart = Math.max(0, bytes.length - 65557);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= tailStart; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ZIP 结构非法');
    const totalEntries = view.getUint16(eocd + 10, true);
    const cdSize = view.getUint32(eocd + 12, true);
    const cdOffset = view.getUint32(eocd + 16, true);
    if (totalEntries === 0xffff || cdOffset === 0xffffffff) throw new Error('不支持 ZIP64 工程');
    if (totalEntries < 1 || totalEntries > MAX_ZIP_ENTRIES) throw new Error('ZIP 条目数量不符合要求');
    if (cdOffset + cdSize > bytes.length) throw new Error('ZIP 目录越界');
    const namePattern = /^(project\.json|[0-9a-f]{32}\.(svg|png|wav|mp3))$/;
    let offset = cdOffset;
    let total = 0;

      const name = new TextDecoder().decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
      if (!namePattern.test(name)) throw new Error('ZIP 条目路径非法：' + name.slice(0, 80));

        const ref = actual.inputs[inputName]?.block;
        if (Array.isArray(canonInput[1])) {

  function readProject(candidate, model) {

  function svgSize(text) {

        window.parent.postMessage({kind: 'PROJECT_EXPORTED', id: currentId, archive, params: reloaded}, '*', [archive]);
      } catch (error) {
        send('ERROR', {error: 'Scratch VM 项目导出或回读失败：' + String(error).slice(0, 400), phase: 'export'});
      } finally {
        if (checker) { try { checker.quit(); } catch (_error) {} }
      }
      return;
    }
    if (data.kind !== 'LOAD' || !Number.isSafeInteger(data.id) || !(data.archive instanceof ArrayBuffer)) return;
    const nextLesson = String(data.lessonId ?? '');
    const nextModel = MODELS[nextLesson];
    currentId = data.id;
    if (!nextModel) { send('ERROR', {error: '沙箱没有这节课的模型：' + nextLesson.slice(0, 20), phase: 'load'}); return; }
    if (!storageAvailable()) { send('ERROR', {error: 'Scratch VM 未加载，请检查 CDN 网络。', phase: 'load'}); return; }
    let candidate = null;
    try {
      if (data.archive.byteLength < 300 || data.archive.byteLength > 5_000_000) throw new Error('项目大小不符合要求');
      const signature = new Uint8Array(data.archive, 0, 2);
      if (signature[0] !== 0x50 || signature[1] !== 0x4b) throw new Error('项目不是 Scratch ZIP');
      validateZipArchive(data.archive);
      candidate = newMachine();
      await candidate.loadProject(data.archive);
      const params = readProject(candidate, nextModel);
      attachObservers(candidate);
      candidate.start();
      reset();
      vm = candidate;
      candidate = null;
      ready = true;
      lessonId = nextLesson;
      currentParams = params;
      send('PROJECT_LOADED', {params, assets: describeAssets(), imported: Boolean(data.imported), source: data.source ?? 'sample'});
      snapshot();
      timer = setInterval(snapshot, 100);
    } catch (error) {
      send('ERROR', {error: '导入 Scratch 项目失败，原作品不变：' + String(error).slice(0, 400), phase: 'load'});
    } finally {
      if (candidate) { try { candidate.quit(); } catch (_error) {} }
    }
  });
})();
</script>
